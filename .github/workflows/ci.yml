name: CI
on:
    push:
    pull_request:
permissions:
    contents: read
jobs:
    verify:
        name: Build and Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
              with:
                  version: '0.12.10'
                  python-version: '3.14.7'
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version: '24.22.0'
            - name: Install Local Stockfish
              run: sudo apt-get update && sudo apt-get install -y stockfish
            - name: Initialize
              run: uv sync --locked --extra vision
            - name: Test
              run: uv run --locked --extra vision pytest
            - name: Build
              run: uv build --out-dir build/packages
    workspace:
        name: Browser Workspace Build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version: '24.22.0'
            - name: Check Out Chessboard Dependency
              run: git clone --depth 1 https://github.com/mayazrakib/chessboard.git ../chessboard
            - name: Build Chessboard
              run: npm ci --prefix ../chessboard && npm run build --prefix ../chessboard
            - name: Build Workspace
              run: npm ci --prefix ui && npm run build --prefix ui
