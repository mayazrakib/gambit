version: '3'

tasks:
    default:
        desc: Display available tasks.
        cmds:
            - task --list
    help:
        desc: Describe available project tasks.
        cmds:
            - task --list
    init:
        desc: Initialize the development environment.
        cmds:
            - "npm ci"
    test:
        desc: Execute automated tests.
        cmds:
            - "npm test"
    build:
        desc: Build project artifacts.
        cmds:
            - "npm run build"
