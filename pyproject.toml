[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "gambit"
version = "0.1.0"
description = "An MCP server for AI-driven chess tutoring and analysis."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{name = "Mayaz Rakib"}]
dependencies = [
    "mcp>=2.1.1,<3",
    "python-chess>=1.999,<2",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
vision = ["numpy>=2.3", "onnxruntime>=1.23", "pillow>=11.3"]

[dependency-groups]
dev = [
    "libcst>=1.9.0",
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.12",
]

[project.scripts]
gambit = "gambit.main:main"

[tool.uv.build-backend]
module-name = "gambit"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src", "."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
lines-after-imports = 1
